<section id="about" class="py-16 md:py-24 text-center">
    
    <h2 class="text-3xl font-bold text-white sm:text-4xl mb-4">
        Sobre Mí & Habilidades
    </h2>
    <p class="text-lg text-gray-400 mb-16 max-w-2xl mx-auto">
        Soy un desarrollador Full-Stack apasionado por las soluciones limpias. Especializado en Angular y Spring Boot para construir aplicaciones robustas.
    </p>

    <div class="max-w-4xl mx-auto px-4">
        
        <div *ngFor="let category of skillCategories" class="mb-14">
            
            <h3 class="text-2xl font-bold text-white sm:text-3xl mb-10 border-b border-gray-700 pb-4 mx-auto max-w-md">
                {{ category.title }}
            </h3>
            
            <div class="flex flex-wrap justify-center gap-6">
                
                <div *ngFor="let skill of category.skills" 
                     class="flex flex-col items-center justify-center p-4 bg-gray-800 rounded-xl 
                            shadow-lg w-32 h-32 transition-transform duration-300 hover:scale-105 
                            hover:shadow-2xl hover:bg-gray-700 cursor-pointer">
                    
                    <img [src]="'https://skillicons.dev/icons?i=' + skill.icon" 
                         [alt]="skill.name + ' Icono'" 
                         class="w-12 h-12 mb-2">
                    
                    <span class="text-gray-300 font-medium text-sm text-center">
                        {{ skill.name }}
                    </span>
                </div>
                
            </div>
        </div>
        
    </div>
</section>
