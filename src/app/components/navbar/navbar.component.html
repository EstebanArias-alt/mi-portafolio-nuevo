<nav
  class="navbar"
  [class.scrolled]="scrolled"
>

  <div class="navbar-container">

    <!-- Logo -->
    <a
      href="#hero"
      class="navbar-logo"
      (click)="closeMenu()"
    >
      <span class="logo-dot"></span>
      Mi Portafolio
    </a>


    <!-- Menú desktop -->
    <div class="navbar-links">

      <a
  href="#hero"
  class="nav-link"
  [class.active]="activeSection === 'hero'"
>
  Inicio
</a>

<a
  href="#about"
  class="nav-link"
  [class.active]="activeSection === 'about'"
>
  Sobre mí
</a>

<a
  href="#projects"
  class="nav-link"
  [class.active]="activeSection === 'projects'"
>
  Proyectos
</a>

<a
  href="#contact"
  class="nav-contact"
  [class.active]="activeSection === 'contact'"
>
  Contacto
  <span class="contact-arrow">→</span>
</a>

    </div>


    <!-- Botón hamburguesa -->
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [class.active]="menuOpen"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>


  <!-- Menú mobile -->
  <div
    class="mobile-menu"
    [class.open]="menuOpen"
  >

    <a
  href="#hero"
  (click)="closeMenu()"
  [class.active]="activeSection === 'hero'"
>
  Inicio
</a>

<a
  href="#about"
  (click)="closeMenu()"
  [class.active]="activeSection === 'about'"
>
  Sobre mí
</a>

<a
  href="#projects"
  (click)="closeMenu()"
  [class.active]="activeSection === 'projects'"
>
  Proyectos
</a>

<a
  href="#contact"
  class="mobile-contact"
  (click)="closeMenu()"
  [class.active]="activeSection === 'contact'"
>
  Contacto
  <span>→</span>
</a>

  </div>

</nav>
