<section id="contact" class="py-24">
  <h2 class="text-3xl font-bold text-center text-white sm:text-4xl mb-4">
    ¡Contáctame!
  </h2>
  <p class="text-center text-lg text-gray-400 mb-12 max-w-xl mx-auto">
    ¿Tienes un proyecto en mente? Envíame un mensaje.
  </p>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="max-w-xl mx-auto space-y-6">
    
    <input type="text" formControlName="discordName" placeholder="Tu Nombre o Discord"
           class="block w-full rounded-lg py-2.5 px-4 bg-gray-800 text-white border-none 
                  ring-1 ring-gray-700 focus:ring-2 focus:ring-blue-500">
    
    <input type="email" formControlName="email" placeholder="tu@email.com"
           class="block w-full rounded-lg py-2.5 px-4 bg-gray-800 text-white border-none 
                  ring-1 ring-gray-700 focus:ring-2 focus:ring-blue-500">

    <textarea formControlName="message" rows="4" placeholder="Cuéntame sobre tu proyecto..."
              class="block w-full rounded-lg py-2.5 px-4 bg-gray-800 text-white border-none 
                     ring-1 ring-gray-700 focus:ring-2 focus:ring-blue-500"></textarea>
    
    <div class="pt-4 text-center">
      <button type="submit" [disabled]="contactForm.invalid"
              class="rounded-lg bg-blue-600 px-8 py-3 text-lg font-semibold text-white 
                     shadow-xl hover:bg-blue-500 disabled:bg-gray-700 transition-colors">
        Enviar Mensaje
      </button>
    </div>
    
  </form>
</section>
