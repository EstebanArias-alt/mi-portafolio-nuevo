<section id="projects" class="projects-section py-24">

  <div class="projects-header">
    <span class="projects-label">
      MIS TRABAJOS
    </span>

    <h2 class="projects-title">
      Proyectos
    </h2>

    <p class="projects-subtitle">
      Algunos de los proyectos que desarrollé utilizando diferentes tecnologías.
    </p>
  </div>


  <div class="projects-grid">

    <article
      *ngFor="let proyecto of proyectos; let i = index"
      class="project-card"
      [style.--delay]="(i * 120) + 'ms'"
    >

      <div class="project-image-wrapper">

        <img
          class="project-image"
          [src]="proyecto.urlImagen"
          [alt]="proyecto.titulo"
        >

        <div class="project-overlay">

          <a
            [href]="proyecto.urlSitio"
            target="_blank"
            rel="noopener noreferrer"
            class="project-overlay-button"
          >
            Ver proyecto
            <span>↗</span>
          </a>

        </div>

      </div>


      <div class="project-content">

        <div class="project-top">

          <h3 class="project-title">
            {{ proyecto.titulo }}
          </h3>

          <span class="project-arrow">
            ↗
          </span>

        </div>


        <div class="project-tech-list">

          <span
            *ngFor="let tech of proyecto.tecnologias; let techIndex = index"
            class="project-tech"
            [style.--tech-delay]="(techIndex * 70) + 'ms'"
          >
            {{ tech }}
          </span>

        </div>


        <a
          [href]="proyecto.urlSitio"
          target="_blank"
          rel="noopener noreferrer"
          class="project-button"
        >

          <span>
            Ver Sitio
          </span>

          <span class="button-arrow">
            →
          </span>

        </a>

      </div>

    </article>

  </div>

</section>
