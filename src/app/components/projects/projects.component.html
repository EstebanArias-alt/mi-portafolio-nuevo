<section id="projects" class="py-24">
  <h2 class="text-3xl font-bold text-center text-white sm:text-4xl mb-12">
    Proyectos
  </h2>
  
  <!-- Contenedor del Grid: Usamos flex y justify-center para centrar el bloque de tarjetas -->
  <div class="flex flex-wrap justify-center gap-8">
  
    <div *ngFor="let proyecto of proyectos"
         class="bg-gray-800 rounded-xl overflow-hidden shadow-2xl w-full max-w-sm md:w-80 
                transform transition-transform duration-300 hover:scale-[1.03]">
      
      <!-- Contenido de la tarjeta... -->
      <img class="w-full h-48 object-cover" [src]="proyecto.urlImagen">
      
      <div class="p-6">
        <h3 class="text-xl font-semibold text-white mb-3">
          {{ proyecto.titulo }}
        </h3>
        
        <a [href]="proyecto.urlSitio" target="_blank" 
           class="inline-block bg-blue-600 text-white px-3 py-1.5 rounded-md text-sm font-medium 
                  hover:bg-blue-500 mb-4">
          Ver Sitio
        </a>
        
        <div class="flex flex-wrap gap-2">
          <span *ngFor="let tech of proyecto.tecnologias"
                class="bg-gray-700 text-gray-300 text-xs font-semibold px-2 py-0.5 rounded">
            {{ tech }}
          </span>
        </div>
      </div>
    </div>
    
  </div>
</section>
